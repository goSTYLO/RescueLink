name: rescuelink_mobile
description: RescueLink Mobile Application built with Flutter and BLoC architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Networking
  http: ^1.1.0
  http_parser: ^4.0.0
  
  # Firebase
  firebase_core: ^2.25.0
  firebase_auth: ^4.17.0
  
  # Location Services
  geolocator: ^10.1.0

  # Audio recording and media
  record: ^6.0.0
  audioplayers: ^6.1.0
  image_picker: ^1.0.7
  video_player: ^2.8.1
  path_provider: ^2.1.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Biometrics
  local_auth: ^2.2.0

  # Environment (.env)
  flutter_dotenv: ^5.1.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

  # WebView (for reCAPTCHA v2; avoids conflict with Firebase)
  webview_flutter: ^4.4.2

  # Map (OpenStreetMap - same as web)
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo/logo.png
    - assets/logo/logo2.png
    - assets/images/login_illustrations.png
    - assets/images/createaccount_illustration.png
    - assets/images/forgotpassword_illustration.png
    - assets/images/verifynumber_illustration.png
    - assets/images/verificationdone_illustration.png
    - assets/images/passwordupdated_illustration.png
    - assets/images/maps_illustration.png
    - assets/images/outsidearea_illustration.png
    - assets/images/accountcreateddone_-illustration.png
    - assets/geojson/dagupan.geojson
